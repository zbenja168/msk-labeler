<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skin &amp; MSK Diagram Labeler · Active Transport</title>
<link rel="stylesheet" href="style.css">
<script defer src="https://activetransport.app/static/tool-track.js"></script>
<!-- at-tools -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="at-tools.css?v=5aac68f3">
<!-- /at-tools -->
</head>
<body>
<!-- at-header --><script src="at-site.js?v=5aac68f3"></script><script src="at-header.js?v=5aac68f3" data-page="app" data-card="0"></script><!-- /at-header -->
<header class="top">
  <a class="back" href="index.html">&larr; All diagrams</a>
  <div class="titles">
    <div class="eyebrow" id="eyebrow">MSK Diagram Labeler</div>
    <h1 id="title">Loading&hellip;</h1>
  </div>
  <nav class="pn"><a id="prev" class="pill">&larr; Prev</a><a id="next" class="pill">Next &rarr;</a></nav>
</header>

<main class="wrap">
  <div class="bar">
    <div class="modes" role="tablist" aria-label="Mode">
      <button class="mode on" data-mode="type" role="tab">Type it</button>
      <button class="mode" data-mode="bank" role="tab">Word bank</button>
    </div>
    <div class="barright">
      <label class="toggle" title="Also match each structure to its function: a function box appears under each name box">
        <input type="checkbox" id="funcs"><span class="track"><span class="thumb"></span></span>
        <span>Functions</span>
      </label>
      <label class="toggle" title="Show right/wrong as soon as you place or enter each answer">
        <input type="checkbox" id="instant"><span class="track"><span class="thumb"></span></span>
        <span>Instant feedback</span>
      </label>
      <div class="score"><span id="score">0</span> / <span id="total">0</span> correct</div>
    </div>
  </div>
  <div class="dtabs" id="dtabs"></div>

  <div class="stage" id="stage">
    <figure class="fig">
      <figcaption id="figcap"></figcaption>
      <div class="svgbox" id="svgbox"></div>
    </figure>
    <aside class="panel">
      <p class="hint" id="hint"></p>
      <ol class="answers" id="answers"></ol>
      <div class="bank" id="bank"></div>
      <div class="actions">
        <button class="btn primary" id="check">Check</button>
        <button class="btn" id="reveal">Reveal answers</button>
        <button class="btn" id="reset">Reset</button>
      </div>
    </aside>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
