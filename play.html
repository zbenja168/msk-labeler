<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSK Diagram Labeler</title>
<link rel="stylesheet" href="style.css">
<script defer src="https://activetransport.app/static/tool-track.js"></script>
</head>
<body>
<style>@keyframes atmRot{0%,2%{transform:rotate(0deg)}7%{transform:rotate(90deg)}10%{transform:rotate(90deg)}14%,35%{transform:rotate(120deg)}40%{transform:rotate(210deg)}43%{transform:rotate(210deg)}47%,68%{transform:rotate(240deg)}73%{transform:rotate(330deg)}76%{transform:rotate(330deg)}80%,100%{transform:rotate(360deg)}}@keyframes atmSub{0%{transform:translate(0,0);opacity:0;fill:#38bdf8}6%{transform:translate(0,-2px);opacity:1;fill:#38bdf8}24%{transform:translate(0,-10px);opacity:1;fill:#38bdf8}28%{transform:translate(0,-16px);opacity:0;fill:#38bdf8}44%{transform:translate(0,-46px);opacity:0;fill:#38bdf8}50%{transform:translate(0,-58px);opacity:0;fill:#f97316}55%{transform:translate(0,-66px);opacity:0;fill:#f97316}59%{transform:translate(0,-72px);opacity:1;fill:#f97316}72%{transform:translate(8px,-88px);opacity:1;fill:#f97316}86%{transform:translate(18px,-102px);opacity:1;fill:#f97316}100%{transform:translate(26px,-116px) scale(.8);opacity:0;fill:#f97316}}.atm-head{transform-box:view-box;transform-origin:60px 35.75px;animation:atmRot 3.6s infinite}.atm-sub{fill:#38bdf8;transform-box:fill-box;transform-origin:center;animation:atmSub 3.6s linear infinite}@media (prefers-reduced-motion:reduce){.atm-head{animation:none}.atm-sub{animation:none;transform:translateY(-6px);opacity:1}}#at-badge-root:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(34,211,238,.18)}</style>
<!-- Active Transport badge (auto-injected; matches the React BrandBadge) -->
<a id="at-badge-root" href="https://activetransport.app" target="_blank" rel="noopener noreferrer" title="Made by Active Transport — AI NBME questions from your notes" style="position:fixed;left:16px;bottom:16px;z-index:2147483000;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 9px;border-radius:999px;background:rgba(15,23,42,.92);border:1px solid #334155;text-decoration:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(0,0,0,.35);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;transition:transform .15s ease,box-shadow .15s ease;">
  <span aria-hidden="true" style="display:inline-block;width:23.6px;height:22px;flex-shrink:0;"><svg viewBox="0 0 120 112" style="display:block;width:100%;height:100%;overflow:visible"><rect x="0" y="68" width="120" height="8" rx="4" fill="#475569"/><rect x="0" y="92" width="120" height="8" rx="4" fill="#475569"/><ellipse cx="60" cy="84" rx="20" ry="16" fill="#0d7f76" opacity=".92" stroke="#38bdf8" stroke-width="1.4" stroke-opacity=".75"/><rect x="55" y="50" width="10" height="36" rx="5" fill="#38bdf8" opacity=".85"/><g class="atm-head"><ellipse cx="60" cy="37" rx="22" ry="16" fill="#fbbf24" opacity=".28"/><circle cx="60" cy="26" r="10.5" fill="#fbbf24" opacity=".85"/><circle cx="43" cy="35" r="10.5" fill="#f59e0b" opacity=".82"/><circle cx="77" cy="35" r="10.5" fill="#f59e0b" opacity=".82"/></g><circle class="atm-sub" cx="60" cy="112" r="4.5"/><g class="atm-head"><circle cx="50" cy="47" r="9" fill="#fbbf24" opacity=".82"/><circle cx="70" cy="47" r="9" fill="#fbbf24" opacity=".82"/></g></svg></span>
  <span style="display:flex;flex-direction:column;line-height:1.05;">
    <span style="font-size:.82rem;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#38bdf8,#22d3ee 45%,#2dd4bf);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">Active Transport</span>
    <span style="font-size:.62rem;color:#64748b;">AI NBME questions &rarr;</span>
  </span>
</a>
<header class="top">
  <a class="back" href="index.html">&larr; All diagrams</a>
  <div class="titles">
    <div class="eyebrow" id="eyebrow">MSK Diagram Labeler</div>
    <h1 id="title">Loading&hellip;</h1>
  </div>
  <nav class="pn"><a id="prev" class="pill">&larr; Prev</a><a id="next" class="pill">Next &rarr;</a></nav>
</header>

<main class="wrap">
  <div class="bar">
    <div class="modes" role="tablist" aria-label="Mode">
      <button class="mode on" data-mode="type" role="tab">Name: type it</button>
      <button class="mode" data-mode="bank" role="tab">Name: word bank</button>
      <button class="mode" data-mode="func" role="tab">Function: bank</button>
    </div>
    <div class="barright">
      <label class="toggle" title="Show right/wrong as soon as you place or enter each answer">
        <input type="checkbox" id="instant"><span class="track"><span class="thumb"></span></span>
        <span>Instant feedback</span>
      </label>
      <div class="score"><span id="score">0</span> / <span id="total">0</span> correct</div>
    </div>
  </div>
  <div class="dtabs" id="dtabs"></div>

  <div class="stage">
    <figure class="fig">
      <figcaption id="figcap"></figcaption>
      <div class="svgbox" id="svgbox"></div>
    </figure>
    <aside class="panel">
      <p class="hint" id="hint"></p>
      <ol class="answers" id="answers"></ol>
      <div class="bank" id="bank"></div>
      <div class="actions">
        <button class="btn primary" id="check">Check</button>
        <button class="btn" id="reveal">Reveal answers</button>
        <button class="btn" id="reset">Reset</button>
      </div>
    </aside>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
